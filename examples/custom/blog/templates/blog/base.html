<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
          content="Default Example blog with threaded comments powered by django-tree-comments." />
    <meta name="keywords" content="django, comments, threaded comments, blog" />
    <title>
      {% block title %}
      {% endblock title %}
      | Default Example
    </title>
    <style>
      :root { --fg:#222; --muted:#666; --bg:#fff; --accent:#0a7; }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .container { max-width: 840px; margin: 0 auto; padding: 24px; }
      header { margin-bottom: 24px; }
      header h1 { font-size: 24px; margin: 0; }
      nav { margin-top: 8px; color: var(--muted); }
      main { display:block; }
      footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #eee; color: var(--muted); font-size: 14px; }
      .post-list { list-style: none; padding: 0; margin: 0; }
      .post-item { padding: 12px 0; border-bottom: 1px solid #eee; }
      .post-item:last-child { border-bottom: 0; }
      .post-meta { color: var(--muted); font-size: 14px; }

      /* --- Tree Comments (custom) --- */
      .comment-app { margin-top: 24px; }

      .comment-list { display: grid; gap: 16px; margin-top: 8px; }
      .comment-item { border: none; border-radius: 0; padding: 0; background: transparent; }
      .comment-item.child { margin-left: 28px; padding-left: 0; }

      .comment-meta { color: var(--muted); font-size: 14px; margin-bottom: 2px; }
      .comment-meta * { font-size: 14px; }
      .comment-user-name { font-weight: 600; }
      .comment-submit-date { color: var(--muted); }
      .comment-content { white-space: pre-wrap; line-height: 1.7; }
      .no-comments { color: var(--muted); font-style: italic; }

      .comment-form { margin-top: 16px; }
      .comment-form p { margin: 0 0 12px 0; }
      .comment-form p[hidden] { display: none; }
      .comment-form label { display: block; font-weight: 500; color: var(--muted); margin-bottom: 4px; }

      .comment-form input[type=text],
      .comment-form input[type=email],
      .comment-form input[type=url],
      .comment-form textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        outline: none;
      }
      .comment-form input:focus,
      .comment-form textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(10, 170, 119, 0.15);
      }

      /* Place Name / Email / URL in one line */
      .comment-form p:has(input[name=name]),
      .comment-form p:has(input[name=email]),
      .comment-form p:has(input[name=url]) {
        display: inline-block;
        width: calc(33.333% - 10px);
        vertical-align: top;
        margin-right: 12px;
      }
      .comment-form p:has(input[name=url]) { margin-right: 0; }

      /* Make comment textarea responsive to container width */
      .comment-form p:has(textarea[name=comment]) { display: block; width: 100%; }

      .comment-form p.error { color: #b00020; }
      .comment-form p.error input,
      .comment-form p.error textarea { border-color: #b00020; }

      .comment-form p.submit { margin-top: 8px; text-align: right; }
      .comment-form .submit-post,
      .comment-form .submit-preview {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .comment-form .submit-preview { background: #999; margin-left: 8px; }
      .comment-form .submit-post:hover,
      .comment-form .submit-preview:hover { opacity: 0.9; }

      @media (max-width: 640px) {
        .comment-form p:has(input[name=name]),
        .comment-form p:has(input[name=email]),
        .comment-form p:has(input[name=url]) {
          display: block;
          width: 100%;
          margin-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <a href="{% url 'blog-index' %}">Default Example</a>
        </h1>
        <nav>
          {% block breadcrumb %}
          {% endblock breadcrumb %}
        </nav>
      </header>
      <main>
        {% block content %}
        {% endblock content %}
      </main>
      <footer>
        Copyright © <a target="_blank"
    href="https://github.com/jukanntenn/django-tree-comments">django-tree-comments</a>
      </footer>
    </div>
  </body>
</html>
