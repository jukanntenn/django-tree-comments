{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}django-tree-comments demo{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'blog/style.css' %}">
        <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    </head>
    <body>
        <header class="site-header">
            <nav>
                <a href="{% url 'blog-index' %}" class="brand">django-tree-comments</a>
                <span class="tagline">{% trans "demo" %}</span>
            </nav>
        </header>
        <main class="container">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer">
            <p>{% trans "Generated data — refresh with" %} <code>python manage.py seed_comments</code>.</p>
        </footer>
    </body>
</html>
