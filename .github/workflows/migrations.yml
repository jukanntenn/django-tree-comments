name: Migrations
on:
  push:
    branches: [main]
    paths:
      - 'tree_comments/models.py'
      - 'tree_comments/migrations/**'
      - 'tests/app/models.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'tree_comments/models.py'
      - 'tree_comments/migrations/**'
      - 'tests/app/models.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python -c "import django; django.setup(); from django.core.management import call_command; call_command('makemigrations', '--check', '--dry-run')"
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
